name = "rpg"
defaultTargets = ["Rpg", "rpg"]

# Build every module under Rpg/, so a new Adventure file is checked even if the game does not import it.
[[lean_lib]]
name = "Rpg"
globs = ["Rpg.+"]

# The game server. It serves the page in web/ on localhost.
[[lean_exe]]
name = "rpg"
root = "Main"

# These programs are not default targets, so `lake check` does not load two `main` functions
# at once. `lake exe <name>` builds each one when needed.

# Prints the checker's errors for each cheating Adventure.
[[lean_exe]]
name = "cheats"
root = "Cheats"

# Runs the fairness check on the Lighthouse and prints each row.
[[lean_exe]]
name = "validate"
root = "Validate"

# Compares the exact Fight model with the simulator, for the add-mechanic skill. It takes
# minutes, so it is outside the one-minute routine check. Run: lake exe agree
[[lean_exe]]
name = "agree"
srcDir = ".agents/skills/add-mechanic"
root = "agree"

# The fairness screen for the add-mechanic skill (screening seed, or `--validation`).
# Run: lake exe screen
[[lean_exe]]
name = "screen"
srcDir = ".agents/skills/add-mechanic"
root = "screen"

# The main theorems for `lake comparator` (see comparator.json). Not a default target:
# `Comparator.Statements` has `sorry` on purpose, as the list of statements.
[[lean_lib]]
name = "Comparator"
globs = ["Comparator.+"]

# Compiled screening and continuation regressions for changes during play.
[[lean_exe]]
name = "change-check"
root = "ChangeCheck"
