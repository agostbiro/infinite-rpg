name = "rpg"
defaultTargets = ["Rpg", "rpg"]

# Build every module under Rpg/, so a new Adventure file is checked even if Main does not import it.
[[lean_lib]]
name = "Rpg"
globs = ["Rpg.+"]

[[lean_exe]]
name = "rpg"
root = "Main"

[[lean_exe]]
name = "audit"
root = "Audit"

[[lean_exe]]
name = "validate"
root = "Validate"
