name = "rpg"
defaultTargets = ["Rpg", "rpg"]

# Build every module under Rpg/, so a new Adventure file is checked even if Main does not import it.
[[lean_lib]]
name = "Rpg"
globs = ["Rpg.+"]

[[lean_exe]]
name = "rpg"
root = "Main"

[[lean_exe]]
name = "validate"
root = "Validate"

# Optional exact combat diagnostic; outside the one-minute routine check. Run: lake exe agree
[[lean_exe]]
name = "agree"
srcDir = ".agents/skills/add-mechanic"
root = "agree"

# Exploratory fairness screen for the add-mechanic skill. Run: lake exe screen
[[lean_exe]]
name = "screen"
srcDir = ".agents/skills/add-mechanic"
root = "screen"
