<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- The Gallery: the iron walkway round the top of the tower, the sea far below, a cracked window. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2a40"/>
    </linearGradient>
    <pattern id="rain" width="40" height="60" patternUnits="userSpaceOnUse">
      <line x1="30" y1="0" x2="18" y2="34" stroke="#3a4f6b" stroke-width="1.4"/>
      <line x1="8" y1="26" x2="0" y2="50" stroke="#3a4f6b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>
  <ellipse cx="300" cy="50" rx="340" ry="60" fill="#121c2e"/>
  <polyline points="190,0 170,60 205,70 160,150" fill="none" stroke="#9fb6d0" stroke-width="3" opacity="0.6"/>
  <!-- the sea, far below -->
  <rect y="250" width="1200" height="150" fill="#0d1a26"/>
  <polyline points="60,290 100,284 140,290" fill="none" stroke="#2c4a66" stroke-width="2"/>
  <polyline points="300,330 350,322 400,330" fill="none" stroke="#2c4a66" stroke-width="2"/>
  <polyline points="520,280 560,274 600,280" fill="none" stroke="#2c4a66" stroke-width="2"/>
  <polygon points="430,400 460,350 520,340 560,370 580,400" fill="#070b12"/>
  <!-- the lamp room and its windows -->
  <rect x="700" y="20" width="420" height="320" fill="#121821"/>
  <polygon points="690,20 1130,20 910,0" fill="#1e2733"/>
  <rect x="730" y="60" width="110" height="200" fill="#1b2a40"/>
  <rect x="860" y="60" width="110" height="200" fill="#1b2a40"/>
  <rect x="990" y="60" width="100" height="200" fill="#1b2a40"/>
  <!-- the cracked window, with a dim light inside -->
  <rect x="860" y="60" width="110" height="200" fill="#2a2116"/>
  <polyline points="900,60 912,120 890,160 920,210 905,260" fill="none" stroke="#0b1220" stroke-width="3"/>
  <polyline points="912,120 950,140" fill="none" stroke="#0b1220" stroke-width="2"/>
  <polyline points="890,160 864,176" fill="none" stroke="#0b1220" stroke-width="2"/>
  <!-- the gallery walkway and its railing -->
  <rect y="330" width="1200" height="70" fill="#070b12"/>
  <rect y="250" width="1200" height="8" fill="#2a3544"/>
  <rect y="290" width="1200" height="5" fill="#2a3544"/>
  <g fill="#2a3544">
    <rect x="40" y="250" width="8" height="80"/><rect x="200" y="250" width="8" height="80"/>
    <rect x="360" y="250" width="8" height="80"/><rect x="520" y="250" width="8" height="80"/>
    <rect x="680" y="250" width="8" height="80"/><rect x="840" y="250" width="8" height="80"/>
    <rect x="1000" y="250" width="8" height="80"/><rect x="1160" y="250" width="8" height="80"/>
  </g>
  <!-- a grappling hand on the rail -->
  <polygon points="300,250 322,240 336,250 330,262 306,262" fill="#0b1220"/>
  <rect width="1200" height="400" fill="url(#rain)" opacity="0.6"/>
</svg>
