<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- The Lamp Room: the great lamp is cold, the keeper is bound, and Grey Hollis stands with his sword. -->
  <defs>
    <pattern id="rain" width="40" height="60" patternUnits="userSpaceOnUse">
      <line x1="30" y1="0" x2="18" y2="34" stroke="#3a4f6b" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="#0b1220"/>
  <!-- the windows that ring the room, with the storm outside -->
  <g fill="#1b2a40">
    <rect x="20" y="30" width="200" height="230"/>
    <rect x="240" y="30" width="200" height="230"/>
    <rect x="760" y="30" width="200" height="230"/>
    <rect x="980" y="30" width="200" height="230"/>
  </g>
  <rect x="20" y="30" width="420" height="230" fill="url(#rain)" opacity="0.6"/>
  <rect x="760" y="30" width="420" height="230" fill="url(#rain)" opacity="0.6"/>
  <rect y="260" width="1200" height="140" fill="#121821"/>
  <!-- the cold lamp: rings of dark glass -->
  <rect x="520" y="250" width="160" height="40" fill="#1e2733"/>
  <ellipse cx="600" cy="150" rx="110" ry="110" fill="#1e2733"/>
  <ellipse cx="600" cy="150" rx="88" ry="98" fill="#2a3544"/>
  <ellipse cx="600" cy="150" rx="66" ry="84" fill="#1e2733"/>
  <ellipse cx="600" cy="150" rx="44" ry="66" fill="#2a3544"/>
  <ellipse cx="600" cy="150" rx="22" ry="44" fill="#1b2a40"/>
  <!-- the keeper, bound to a chair -->
  <rect x="300" y="250" width="12" height="100" fill="#070b12"/>
  <rect x="380" y="290" width="10" height="60" fill="#070b12"/>
  <rect x="300" y="280" width="90" height="14" fill="#070b12"/>
  <circle cx="340" cy="200" r="20" fill="#070b12"/>
  <polygon points="318,282 324,222 358,222 366,282" fill="#070b12"/>
  <rect x="318" y="244" width="48" height="5" fill="#8c2f2f"/>
  <!-- Grey Hollis, sword drawn -->
  <circle cx="840" cy="150" r="26" fill="#070b12"/>
  <polygon points="790,380 800,190 840,176 884,192 900,380" fill="#070b12"/>
  <polygon points="800,200 740,270 752,280 812,224" fill="#070b12"/>
  <polygon points="740,270 640,330 644,338 752,280" fill="#9fb6d0"/>
  <rect x="826" y="136" width="30" height="8" fill="#2a3544"/>
</svg>
