<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- The Keeper's Debt: dawn after the storm, the light still burning, warm windows in the village. -->
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121c2e"/>
      <stop offset="0.6" stop-color="#3f4a66"/>
      <stop offset="1" stop-color="#c47a2c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f2b35b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#dawn)"/>
  <ellipse cx="600" cy="240" rx="200" ry="40" fill="#f2b35b" opacity="0.35"/>
  <rect y="240" width="1200" height="160" fill="#163049"/>
  <rect x="420" y="250" width="360" height="4" fill="#f2b35b" opacity="0.5"/>
  <rect x="480" y="270" width="240" height="3" fill="#f2b35b" opacity="0.35"/>
  <!-- the lighthouse on its rock, far off -->
  <polygon points="880,250 910,226 960,220 1000,232 1030,250" fill="#070b12"/>
  <polygon points="940,224 966,224 962,150 944,150" fill="#e9e1cf"/>
  <rect x="942" y="180" width="24" height="6" fill="#8c2f2f"/>
  <circle cx="953" cy="140" r="34" fill="url(#lamp)"/>
  <rect x="945" y="132" width="16" height="16" fill="#ffd98a"/>
  <polygon points="941,132 965,132 953,122" fill="#2a3544"/>
  <!-- the village on the shore -->
  <polygon points="0,300 0,400 760,400 700,330 520,300" fill="#0a0f16"/>
  <g fill="#121821">
    <rect x="40" y="250" width="110" height="80"/>
    <rect x="180" y="262" width="90" height="70"/>
    <rect x="300" y="240" width="120" height="90"/>
    <rect x="450" y="270" width="80" height="60"/>
  </g>
  <g fill="#070b12">
    <polygon points="30,252 95,208 160,252"/>
    <polygon points="172,264 225,226 278,264"/>
    <polygon points="292,242 360,196 428,242"/>
    <polygon points="442,272 490,238 538,272"/>
  </g>
  <g fill="#ffd98a">
    <rect x="70" y="276" width="18" height="18"/>
    <rect x="110" y="276" width="18" height="18"/>
    <rect x="210" y="284" width="16" height="16"/>
    <rect x="330" y="266" width="20" height="20"/>
    <rect x="374" y="266" width="20" height="20"/>
    <rect x="476" y="290" width="14" height="14"/>
  </g>
  <rect x="380" y="200" width="14" height="40" fill="#070b12"/>
</svg>
