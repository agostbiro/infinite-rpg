<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- The Store Room: two wreckers play dice by a lantern, backs to the stair. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#f2b35b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f2b35b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="#0b1220"/>
  <rect y="300" width="1200" height="100" fill="#070b12"/>
  <!-- the lantern light on the walls -->
  <ellipse cx="560" cy="220" rx="420" ry="240" fill="url(#glow)"/>
  <!-- the stair, going up on the right -->
  <g fill="#1e2733">
    <rect x="900" y="270" width="300" height="30"/>
    <rect x="950" y="230" width="250" height="40"/>
    <rect x="1000" y="190" width="200" height="40"/>
    <rect x="1050" y="150" width="150" height="40"/>
    <rect x="1100" y="110" width="100" height="40"/>
    <rect x="1150" y="70" width="50" height="40"/>
  </g>
  <!-- barrels and a coil of rope on the left -->
  <rect x="70" y="200" width="90" height="110" rx="20" fill="#121821"/>
  <rect x="70" y="228" width="90" height="6" fill="#2a3544"/>
  <rect x="70" y="276" width="90" height="6" fill="#2a3544"/>
  <rect x="170" y="220" width="80" height="90" rx="18" fill="#121821"/>
  <rect x="170" y="246" width="80" height="6" fill="#2a3544"/>
  <ellipse cx="300" cy="300" rx="50" ry="14" fill="none" stroke="#2a3544" stroke-width="8"/>
  <!-- the table, the lantern, and the dice -->
  <rect x="430" y="250" width="280" height="16" fill="#2a2116"/>
  <rect x="450" y="266" width="14" height="50" fill="#2a2116"/>
  <rect x="676" y="266" width="14" height="50" fill="#2a2116"/>
  <rect x="556" y="196" width="28" height="40" fill="#ffd98a"/>
  <rect x="550" y="188" width="40" height="10" fill="#2a2116"/>
  <rect x="550" y="234" width="40" height="16" fill="#2a2116"/>
  <rect x="616" y="238" width="12" height="12" fill="#efe4c8"/>
  <rect x="636" y="240" width="11" height="10" fill="#efe4c8"/>
  <!-- the two wreckers, hunched over the game -->
  <circle cx="420" cy="170" r="24" fill="#070b12"/>
  <polygon points="372,320 386,200 440,194 470,250 452,320" fill="#070b12"/>
  <circle cx="740" cy="176" r="22" fill="#070b12"/>
  <polygon points="690,320 704,250 730,198 784,204 800,320" fill="#070b12"/>
  <polygon points="700,248 640,240 642,252 702,262" fill="#070b12"/>
</svg>
