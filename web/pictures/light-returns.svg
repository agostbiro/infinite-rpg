<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- The Light Returns: the lamp burns again, and far out a ship turns away from the reef. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2a40"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#f2b35b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2b35b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>
  <!-- the beams over the sea -->
  <polygon points="260,96 1200,20 1200,160" fill="#f2b35b" opacity="0.18"/>
  <polygon points="260,96 0,40 0,120" fill="#f2b35b" opacity="0.10"/>
  <rect y="240" width="1200" height="160" fill="#10243a"/>
  <polygon points="0,240 200,234 420,242 640,232 900,240 1200,232 1200,256 0,256" fill="#163049"/>
  <polygon points="600,240 1200,200 1200,280" fill="#f2b35b" opacity="0.10"/>
  <!-- the reef -->
  <polygon points="520,262 550,246 590,250 610,264" fill="#070b12"/>
  <polygon points="660,272 690,256 720,260 740,274" fill="#070b12"/>
  <!-- the ship, turning away -->
  <polygon points="900,226 1010,226 990,244 916,244" fill="#070b12"/>
  <rect x="952" y="150" width="5" height="78" fill="#070b12"/>
  <polygon points="957,156 1000,206 957,206" fill="#2a3544"/>
  <polygon points="952,160 914,206 952,206" fill="#1e2733"/>
  <rect x="1010" y="230" width="6" height="2" fill="#ffd98a"/>
  <!-- the rock and the lit lighthouse -->
  <polygon points="140,250 180,212 240,200 300,206 350,232 380,250" fill="#070b12"/>
  <polygon points="240,210 280,210 272,108 248,108" fill="#e9e1cf"/>
  <rect x="242" y="148" width="36" height="8" fill="#8c2f2f"/>
  <rect x="244" y="182" width="34" height="8" fill="#8c2f2f"/>
  <circle cx="260" cy="96" r="80" fill="url(#lamp)"/>
  <rect x="246" y="84" width="28" height="22" fill="#ffd98a"/>
  <polygon points="240,84 280,84 260,66" fill="#2a3544"/>
</svg>
