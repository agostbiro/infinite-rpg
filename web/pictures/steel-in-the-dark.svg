<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Steel in the Dark: two blades meet; lightning lights the room for a moment. -->
  <defs>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#f2b35b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f2b35b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="#070b12"/>
  <!-- a window with lightning -->
  <rect x="80" y="40" width="200" height="240" fill="#1b2a40"/>
  <polyline points="190,40 160,120 200,130 150,240" fill="none" stroke="#e9e1cf" stroke-width="4"/>
  <polygon points="80,280 280,280 520,400 0,400" fill="#1b2a40" opacity="0.35"/>
  <!-- the blades crossing -->
  <circle cx="600" cy="170" r="150" fill="url(#flash)"/>
  <polygon points="380,330 392,342 640,150 628,138" fill="#9fb6d0"/>
  <polygon points="820,330 808,342 560,150 572,138" fill="#9fb6d0"/>
  <rect x="356" y="330" width="44" height="12" fill="#2a2116" transform="rotate(-38 378 336)"/>
  <rect x="800" y="330" width="44" height="12" fill="#2a2116" transform="rotate(38 822 336)"/>
  <!-- sparks -->
  <g stroke="#ffd98a" stroke-width="3">
    <line x1="600" y1="168" x2="600" y2="120"/>
    <line x1="600" y1="168" x2="640" y2="132"/>
    <line x1="600" y1="168" x2="560" y2="134"/>
    <line x1="600" y1="168" x2="652" y2="176"/>
    <line x1="600" y1="168" x2="548" y2="178"/>
  </g>
  <!-- two shapes in the dark -->
  <polygon points="200,400 250,300 300,290 330,400" fill="#0b1220"/>
  <polygon points="900,400 930,290 980,300 1020,400" fill="#0b1220"/>
</svg>
