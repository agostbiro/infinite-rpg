<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- Wreckers! Two men with long knives come out of the lantern light. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b35b" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#8c2f2f" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8c2f2f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="#0b1220"/>
  <ellipse cx="600" cy="200" rx="520" ry="260" fill="url(#glow)"/>
  <rect y="330" width="1200" height="70" fill="#070b12"/>
  <!-- the first wrecker, knife high -->
  <circle cx="440" cy="110" r="30" fill="#070b12"/>
  <polygon points="380,340 392,170 440,140 492,170 508,340" fill="#070b12"/>
  <polygon points="486,176 560,100 574,112 506,196" fill="#070b12"/>
  <polygon points="560,100 600,40 608,46 574,112" fill="#ffd98a"/>
  <polygon points="392,180 340,250 352,262 404,206" fill="#070b12"/>
  <!-- the second wrecker, knife low -->
  <circle cx="780" cy="130" r="28" fill="#070b12"/>
  <polygon points="720,340 730,190 780,160 828,186 846,340" fill="#070b12"/>
  <polygon points="730,200 662,262 674,276 744,226" fill="#070b12"/>
  <polygon points="662,262 610,300 616,308 674,276" fill="#ffd98a"/>
  <polygon points="826,196 880,250 868,262 818,222" fill="#070b12"/>
  <!-- eyes catch the light -->
  <rect x="446" y="104" width="10" height="3" fill="#f2b35b"/>
  <rect x="770" y="124" width="10" height="3" fill="#f2b35b"/>
</svg>
